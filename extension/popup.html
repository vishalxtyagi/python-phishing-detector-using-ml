<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #f8f9fa;
      color: #212529;
    }
    header {
      background: #212529;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #status-bar {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid #dee2e6;
      word-break: break-all;
      color: #6c757d;
    }
    #result-container { padding: 16px; }
    #score-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
      margin: 0 auto 12px;
      border: 4px solid #dee2e6;
    }
    #risk-label {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    #explanations { list-style: none; }
    #explanations li {
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
    }
    .sev-high   { background: #f8d7da; color: #842029; }
    .sev-medium { background: #fff3cd; color: #664d03; }
    .sev-low    { background: #d1ecf1; color: #0c5460; }
    #loading { text-align: center; padding: 24px; color: #6c757d; }
    #error-msg { color: #842029; padding: 12px; text-align: center; }
    #settings { padding: 10px 16px; border-top: 1px solid #dee2e6; font-size: 12px; color: #6c757d; }
    #settings a { color: #0d6efd; text-decoration: none; cursor: pointer; }
    #api-url-input {
      width: 100%; padding: 6px 8px; font-size: 12px;
      border: 1px solid #ced4da; border-radius: 4px; margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <span>🛡️</span>
    <h1>Phishing Detector</h1>
  </header>

  <div id="status-bar">Checking current tab…</div>

  <div id="result-container">
    <div id="loading">Scanning…</div>
    <div id="error-msg" style="display:none"></div>
    <div id="result" style="display:none">
      <div id="score-circle">--</div>
      <div id="risk-label">--</div>
      <ul id="explanations"></ul>
    </div>
  </div>

  <div id="settings">
    API: <a id="toggle-api">configure</a>
    <input id="api-url-input" type="url" placeholder="http://localhost:8000" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
